[package]
name = "f-run"
version = "1.0.0+2026051800"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
figlet-rs = {version = "0.1.5", default-features = false}
glob = "0.3.3"
indicatif = { version = "0.17.4", default-features = false}
regex-lite = "0.1.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
time = { version = "0.3.47" , features = ["macros", "local-offset", "formatting"]}
zip = { version = "8.4.0", default-features = false, features = ["deflate"] }
ureq = { version = "3.3", default-features = false, features = ["json", "rustls"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

[profile.release.build-override]
opt-level = "z"